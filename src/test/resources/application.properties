# \uD14C\uC2A4\uD2B8 \uCEE8\uD14D\uC2A4\uD2B8\uB9C8\uB2E4 \uB3C5\uB9BD\uC801\uC778 H2 DB \uC0AC\uC6A9
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:prodflow-test-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,LINE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.show_sql=false
spring.test.database.replace=none
# \uAE30\uC874 \uC2DC\uB4DC \uB370\uC774\uD130\uB97C \uC678\uBD80 DB \uC5C6\uC774 \uCD08\uAE30\uD654
spring.sql.init.mode=always
# \uC678\uBD80 \uACC4\uC815\uACFC API \uD0A4\uC5D0 \uC758\uC874\uD558\uC9C0 \uC54A\uB294 \uD14C\uC2A4\uD2B8 \uAC12
jwt.secret=cXVvdGF0aW9uLXRlc3Qtc2VjcmV0LW11c3QtYmUtMzItYnl0ZXM=
jwt.access-token-expiration=60000
jwt.refresh-token-expiration=120000
spring.mail.host=127.0.0.1
spring.mail.username=test@prodflow.local
spring.mail.password=testpassword
spring.mail.test-connection=false
holiday.api.service-key=test-dummy-holiday-key
shipment.tracking.api.key=test-dummy-tracking-key
aws.region=ap-northeast-2
aws.s3.bucket=prodflow-test
portone.api-secret=test-dummy-secret
portone.store-id=test-store
portone.channel-key=test-channel
spring.ai.google.genai.api-key=test-gemini-key
groq.api-key=test-groq-key
# \uCEE8\uD14D\uC2A4\uD2B8 \uAE30\uB3D9\uC6A9 AI \uC5F0\uACB0. \uC870\uD68C \uD14C\uC2A4\uD2B8\uB294 JPA\uC640 \uAC19\uC740 DB\uB97C \uC8FC\uC785\uD55C\uB2E4.
ai.datasource.jdbc-url=jdbc:h2:mem:ai-unused;MODE=MySQL;DB_CLOSE_DELAY=-1
ai.datasource.driver-class-name=org.h2.Driver
ai.datasource.username=sa
ai.datasource.password=
portone.webhook-url=https://example.org/api/v1/payments/webhook
payment.virtual-account-bank=SHINHAN
# \uD14C\uC2A4\uD2B8 \uC2DC\uC791 \uC2DC \uC678\uBD80 \uD638\uCD9C\uACFC \uC790\uB3D9 \uB370\uC774\uD130 \uBCC0\uACBD \uBC29\uC9C0
holiday.initialization.enabled=false
holiday.scheduling.enabled=false
quotation.expiration.enabled=false
shipment.tracking.refresh-enabled=false
