info:
  name: 변경 전 업무 API 거부
  type: http
  seq: 3

docs: |-
  비밀번호를 바꾸기 전에는 업무 API가 403이다.

http:
  method: GET
  url: "{{baseUrl}}/api/v1/lines"
  auth:
    type: bearer
    token: "{{orderTempToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(403);
          expect(body.code).to.equal("PASSWORD_CHANGE_REQUIRED");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
