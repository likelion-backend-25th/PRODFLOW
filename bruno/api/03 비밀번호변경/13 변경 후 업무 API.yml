info:
  name: 변경 후 업무 API
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/me"
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body.mustChangePassword).to.equal(false);
          expect(body.role).to.equal("ORDER_MANAGER");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
