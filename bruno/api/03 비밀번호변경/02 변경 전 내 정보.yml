info:
  name: 변경 전 내 정보
  type: http
  seq: 2

docs: |-
  임시 비밀번호 상태에서도 내 정보 조회는 허용된다.

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/me"
  auth:
    type: bearer
    token: "{{orderTempToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body.mustChangePassword).to.equal(true);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
