info:
  name: 수주관리자 비밀번호 변경
  type: http
  seq: 4

docs: |-
  변경에 성공하면 Refresh Token이 폐기된다. 새 비밀번호로 다시 로그인해야 한다.

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/change-password"
  body:
    type: json
    data: |-
      {
        "temporaryPassword": "{{tempPassword}}",
        "newPassword": "{{newPassword}}",
        "confirmPassword": "{{newPassword}}"
      }
  auth:
    type: bearer
    token: "{{orderTempToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(204);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
