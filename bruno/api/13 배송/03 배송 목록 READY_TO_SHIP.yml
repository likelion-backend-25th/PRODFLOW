info:
  name: 배송 목록 READY_TO_SHIP
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/shipments?tab=READY_TO_SHIP&page=0&size=10"
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body).to.have.property("counts");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
