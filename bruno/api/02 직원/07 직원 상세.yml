info:
  name: 직원 상세
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{orderUserId}}"
  auth:
    type: bearer
    token: "{{adminAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(String(body.id)).to.equal(bru.getVar("orderUserId"));
          expect(body.role).to.equal("ORDER_MANAGER");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
