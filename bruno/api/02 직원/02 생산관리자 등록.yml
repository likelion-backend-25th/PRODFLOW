runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(201);
          expect(body.role).to.equal("PRODUCTION_MANAGER");
          expect(body.mustChangePassword).to.equal(true);
          expect(body.status).to.equal("ACTIVE");
          bru.setVar("prodUserId", String(body.id));
        });

