info:
  name: 시드 작업 상세
  type: http
  seq: 2

docs: |-
  시드 작업 15는 조회만 한다. 상태는 바꾸지 않는다.

http:
  method: GET
  url: "{{baseUrl}}/api/v1/work-orders/15"
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body.id).to.equal(15);
          expect(body.workNo).to.be.a("string");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
