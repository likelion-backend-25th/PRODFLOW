info:
  name: 납기 이행률 데이터 없음
  type: http
  seq: 12

docs: |-
  기존 컬렉션의 빈 기간 케이스다. 날짜 순서는 올바르고, 해당 기간 실적이 없으면 비율은 0이다.

http:
  method: GET
  url: "{{baseUrl}}/api/v1/statistics/delivery-performance?from=2030-01-01&to=2030-01-31"
  auth:
    type: bearer
    token: "{{inquiryAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body.totalOrderCount).to.equal(0);
          expect(body.onTimeDeliveryRate).to.equal(0);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
