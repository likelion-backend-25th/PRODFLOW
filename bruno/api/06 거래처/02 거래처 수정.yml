info:
  name: 거래처 수정
  type: http
  seq: 2

docs: |-
  수정 API는 성공 시 201을 반환한다.

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/clients/{{clientId}}"
  body:
    type: json
    data: |-
      {
        "company": "브루노거래처수정{{runStamp}}",
        "employee": "김브루노",
        "email": "{{clientEmail}}",
        "phone": "010-7000-0002",
        "userId": {{orderUserId}},
        "address": {
          "zipcode": "06236",
          "roadAddress": "서울특별시 강남구 테헤란로 152",
          "detailAddress": "브루노 4층"
        }
      }
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(201);
          expect(body.phone).to.equal("010-7000-0002");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
