info:
  name: 가상계좌 발급
  type: http
  seq: 3

docs: |-
  시드 결제 15는 READY 잔금이다. PortOne 발급을 호출한다.

http:
  method: POST
  url: "{{baseUrl}}/api/v1/payments/15/issue"
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect([200, 409, 502, 503]).to.include(status);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
