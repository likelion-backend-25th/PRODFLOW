  url: "{{baseUrl}}/api/v1/shipments/tracking?carrierCode=04&trackingNumber=530012345671"
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect([200, 502, 503]).to.include(status);
        });
