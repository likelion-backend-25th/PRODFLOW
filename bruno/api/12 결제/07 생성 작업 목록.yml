info:
  name: 생성 작업 목록
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/work-orders?orderId={{orderId}}&page=0&size=5"
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body.content.length).to.be.at.least(1);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
