info:
  name: 가상계좌 이력
  type: http
  seq: 5

docs: |-
  시드 결제 10은 재발급 이력이 있다. 조회만 한다.

http:
  method: GET
  url: "{{baseUrl}}/api/v1/payments/10/virtual-accounts"
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body).to.be.an("array");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
