info:
  name: 작업 담당자 변경
  type: http
  seq: 9

docs: |-
  담당자 변경은 수주 관리자 토큰으로 한다. 라인은 바꾸지 않는다.

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/work-orders/{{workOrderId}}"
  body:
    type: json
    data: |-
      { "assignedId": {{prodUserId}} }
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(String(body.assignedId)).to.equal(bru.getVar("prodUserId"));
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
