info:
  name: USER-01 로그인
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@prodflow.local",
        "password": "Abcd123456!?"
      }
      // {
      //   "email": "minjun@exaddmple.com",
      //   "password": "Abcd123456!?"
      // }
      // {
      //   "email": "minjun@exaddmple.com",
      //   "password": "prodflow1234!"
      // }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.accessToken
        method: jsonq
      variable:
        name: accessToken
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
