info:
  name: 수주 상세
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/orders/{{orderId}}"
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body.items.length).to.be.at.least(1);
          bru.setVar("orderProductId", String(body.items[0].id));
          bru.setVar("orderItemName", body.items[0].productName);
          bru.setVar("orderItemQty", String(body.items[0].quantity));
          bru.setVar("orderItemPrice", String(body.items[0].unitPrice));
          bru.setVar("orderItemSupply", String(body.items[0].supplyAmount));
          bru.setVar("supplyAmount", String(body.supplyAmount));
          bru.setVar("vatAmount", String(body.vatAmount));
          bru.setVar("orderTotal", String(body.totalAmount));
          bru.setVar("vatIncluded", String(body.vatIncluded));
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
