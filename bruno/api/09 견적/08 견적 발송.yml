info:
  name: 견적 발송
  type: http
  seq: 8

docs: |-
  수신 메일은 방금 만든 거래처 이메일이다. 메일 서버 실패여도 상태는 SENT가 될 수 있다.

http:
  method: POST
  url: "{{baseUrl}}/api/v1/quotations/{{quotationId}}/send"
  body:
    type: json
    data: |-
      { "confirmationToken": "{{confirmationToken}}" }
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body.status).to.equal("SENT");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
