info:
  name: 견적 PDF 재생성
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/quotations/{{quotationId}}/pdf/regenerate"
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          bru.setVar("confirmationToken", body.confirmationToken);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
