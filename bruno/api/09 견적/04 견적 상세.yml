info:
  name: 견적 상세
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/quotations/{{quotationId}}"
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body.items).to.be.an("array");
          expect(body.items.length).to.be.at.least(1);
          bru.setVar("quotationItemId", String(body.items[0].id));
          bru.setVar("dueDate", body.estimatedDueDate);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
