info:
  name: 거절용 발송
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/api/v1/quotations/{{rejectQuotationId}}/send"
  body:
    type: json
    data: |-
      { "confirmationToken": "{{rejectQuotationIdToken}}" }
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body.status).to.equal("SENT");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
