info:
  name: 납기 재산정 저장
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/quotations/{{quotationId}}/schedule"
  body:
    type: json
    data: |-
      { "requestedDueDate": "2027-06-30" }
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body.status).to.equal("SENT");
          bru.setVar("quotationItemId", String(body.items[0].id));
          bru.setVar("dueDate", body.estimatedDueDate);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
