info:
  name: 품목 수정
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/products/{{productId}}"
  body:
    type: json
    data: |-
      {
        "productName": "브루노 클리어 케이스 수정",
        "deviceCode": 1,
        "productDescription": "Bruno 시연 품목 수정",
        "currentPrice": 16000
      }
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body.currentPrice).to.equal(16000);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
