info:
  name: 품목 생산중단
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/products/{{productId}}/status"
  body:
    type: json
    data: |-
      { "status": "DISCONTINUED" }
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body.status).to.equal("DISCONTINUED");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
