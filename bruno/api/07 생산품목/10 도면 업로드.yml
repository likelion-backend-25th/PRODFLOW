info:
  name: 도면 업로드
  type: http
  seq: 10

docs: |-
  S3가 설정되어 있어야 201이다. 파트 이름은 file이다.

http:
  method: POST
  url: "{{baseUrl}}/api/v1/products/{{productId}}/drawings"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: files/drawing.txt
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(201);
          expect(body).to.be.an("array");
          bru.setVar("drawingId", String(body[0].id));
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
