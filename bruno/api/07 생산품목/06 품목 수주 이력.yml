info:
  name: 품목 수주 이력
  type: http
  seq: 6

docs: |-
  시드 품목 1의 기존 수주 이력이다. 방금 등록한 품목은 아직 수주가 없다.

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/1/orders?size=3"
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body).to.be.an("array");
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
