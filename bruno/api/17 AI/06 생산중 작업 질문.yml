info:
  name: 생산중 작업 질문
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/ai/conversations/{{conversationId}}/messages"
  body:
    type: json
    data: |-
      {
        "model": "gemini-3.1-flash-lite",
        "message": "생산 중인 작업지시가 있으면 작업번호와 라인만 알려줘"
      }
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body.answer).to.be.a("string");
        });
settings:
  encodeUrl: true
  timeout: 120000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
