  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(201);
          const conversationId = (body && typeof body === "object") ? (body.conversationId || body.id) : body;
          expect(conversationId).to.be.ok;
          bru.setVar("conversationId", String(conversationId));
        });

