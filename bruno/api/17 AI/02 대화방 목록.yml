info:
  name: 대화방 목록
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/ai/conversations"
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(body).to.be.an("array");
          expect(body.some(function (room) {
            return String(room.conversationId) === bru.getVar("conversationId");
          })).to.equal(true);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
