info:
  name: 대화방 상세
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/ai/conversations/{{conversationId}}"
  auth:
    type: bearer
    token: "{{orderAccessToken}}"
runtime:
  scripts:
    - type: tests
      code: |-
        const status = (typeof res.getStatus === "function") ? res.getStatus() : res.status;
        const body = (typeof res.getBody === "function") ? res.getBody() : res.body;
        test("응답", function () {
          expect(status).to.equal(200);
          expect(String(body.conversationId)).to.equal(bru.getVar("conversationId"));
          expect(body.messages).to.be.an("array");
          expect(body.isClosed).to.equal(false);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
