info:
  name: 로그인 비번 변경 copy
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/change-password"
  body:
    type: json
    data: |-
      {
        "temporaryPassword": "Abcd123456!?",
        "newPassword": "Abcd123456!",
        "confirmPassword": "Abcd123456!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
