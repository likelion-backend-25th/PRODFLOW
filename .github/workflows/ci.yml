name: CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]

  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Seoul

    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v7

      - name: JDK 25 환경 설정
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 시스템 프롬프트 배치
        env:
          PRODFLOW_SYSTEM_PROMPT: ${{ secrets.PRODFLOW_SYSTEM_PROMPT }}
        run: |
          mkdir -p src/main/resources/prompts

          if [ -z "$PRODFLOW_SYSTEM_PROMPT" ]; then
            echo "PRODFLOW_SYSTEM_PROMPT 시크릿이 없습니다."
            exit 1
          fi

          printf '%s' "$PRODFLOW_SYSTEM_PROMPT" > src/main/resources/prompts/prodflow-system.txt

      - name: Gradle 빌드 및 테스트 수행
        run: ./gradlew test --no-daemon --info --stacktrace --scan
        env:
          # CI에서는 RDS가 아닌 MySQL 서비스 컨테이너 사용
          MYSQL_DB_HOST: "127.0.0.1"
          MYSQL_DB_PORT: "3306"

          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}

          # AI 조회 전용 DB 계정
          AI_DB_USERNAME: ${{ secrets.AI_DB_USERNAME }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}

          # JWT
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TOKEN_EXPIRATION: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}
          JWT_REFRESH_TOKEN_EXPIRATION: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION }}

          # AWS
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}

          # 메일
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

          # 공휴일 API
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}

          # 배송 조회 API
          SHIPMENT_TRACKING_API_KEY: ${{ secrets.SHIPMENT_TRACKING_API_KEY }}

          # 외부 API 실행 설정
          HOLIDAY_INITIALIZATION_ENABLED: "false"
          SHIPMENT_TRACKING_REFRESH_ENABLED: "false"

          # AI API 인증키
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRODFLOW_SYSTEM_PROMPT: ${{ secrets.PRODFLOW_SYSTEM_PROMPT }}
