name: Deploy PRODFLOW

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prodflow-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v6

      # 2. AI 시스템 프롬프트 파일 생성
      - name: 시스템 프롬프트 배치
        env:
          PRODFLOW_SYSTEM_PROMPT: ${{ secrets.PRODFLOW_SYSTEM_PROMPT }}
        run: |
          if [ -z "$PRODFLOW_SYSTEM_PROMPT" ]; then
            echo "PRODFLOW_SYSTEM_PROMPT 시크릿이 없습니다."
            exit 1
          fi

          mkdir -p src/main/resources/prompts

          printf '%s' "$PRODFLOW_SYSTEM_PROMPT" \
            > src/main/resources/prompts/prodflow-system.txt

          test -s src/main/resources/prompts/prodflow-system.txt

      # 3. Docker Hub 로그인
      - name: Docker Hub Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 5. Docker 이미지 빌드 및 업로드
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            minkyolim/prodflow:latest
            minkyolim/prodflow:${{ github.sha }}

      # 6. GitHub Secrets로 배포용 환경변수 파일 생성
      - name: EC2 환경변수 파일 생성
        env:
          MYSQL_DB_HOST: ${{ secrets.MYSQL_DB_HOST }}
          MYSQL_DB_PORT: ${{ secrets.MYSQL_DB_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}

          AI_DB_USERNAME: ${{ secrets.AI_DB_USERNAME }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TOKEN_EXPIRATION: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}
          JWT_REFRESH_TOKEN_EXPIRATION: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION }}

          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}

          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
          SHIPMENT_TRACKING_API_KEY: ${{ secrets.SHIPMENT_TRACKING_API_KEY }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          keys = [
              "MYSQL_DB_HOST",
              "MYSQL_DB_PORT",
              "MYSQL_DATABASE",
              "MYSQL_USER",
              "MYSQL_PASSWORD",
              "AI_DB_USERNAME",
              "AI_DB_PASSWORD",
              "JWT_SECRET",
              "JWT_ACCESS_TOKEN_EXPIRATION",
              "JWT_REFRESH_TOKEN_EXPIRATION",
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_REGION",
              "AWS_S3_BUCKET",
              "MAIL_USERNAME",
              "MAIL_PASSWORD",
              "HOLIDAY_API_KEY",
              "SHIPMENT_TRACKING_API_KEY",
              "GROQ_API_KEY",
              "GEMINI_API_KEY",
          ]

          # 시크릿 누락 확인
          missing = [
              key for key in keys
              if not os.environ.get(key)
          ]

          if missing:
              raise SystemExit(
                  "GitHub Secrets 누락: " + ", ".join(missing)
              )

          # Docker Compose .env 형식에 맞게 처리
          def quote(value):
              if "\n" in value or "\r" in value:
                  raise SystemExit(
                      "여러 줄로 된 환경변수는 지원하지 않습니다."
                  )

              escaped = value.replace("\\", "\\\\")
              escaped = escaped.replace("'", "\\'")

              return "'" + escaped + "'"

          os.umask(0o077)

          content = "".join(
              f"{key}={quote(os.environ[key])}\n"
              for key in keys
          )

          Path(".env.deploy").write_text(
              content,
              encoding="utf-8"
          )
          PY

      # 7. 환경변수 파일을 EC2로 전송
      - name: EC2 환경변수 파일 전송
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: ".env.deploy"
          target: "/home/ec2-user/prodflow"

      # 8. EC2 환경변수 갱신 및 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m

          script: |
            set -e

            cd /home/ec2-user/prodflow
            umask 077

            # 임시 환경변수 파일 확인
            test -s .env.deploy
            chmod 600 .env.deploy

            # 기존 .env 백업
            HAD_ENV=0

            if [ -f .env ]; then
              HAD_ENV=1
              cp .env .env.backup
              chmod 600 .env.backup
            fi

            # 기존 환경변수 유지 + GitHub Secrets 값 갱신
            python3 - <<'PY'
            import os
            import re
            from pathlib import Path

            source = Path(".env.deploy")
            target = Path(".env")

            updates = {}

            for line in source.read_text(
                encoding="utf-8"
            ).splitlines():
                key, separator, value = line.partition("=")

                if separator and key:
                    updates[key] = value

            if target.exists():
                lines = target.read_text(
                    encoding="utf-8"
                ).splitlines()
            else:
                lines = []

            result = []
            updated = set()

            for line in lines:
                match = re.match(
                    r"^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=",
                    line
                )

                if match:
                    key = match.group(1)

                    if key in updates:
                        if key not in updated:
                            result.append(
                                f"{key}={updates[key]}"
                            )
                            updated.add(key)

                        continue

                result.append(line)

            for key, value in updates.items():
                if key not in updated:
                    result.append(f"{key}={value}")

            temporary = Path(".env.new")
            temporary.write_text(
                "\n".join(result) + "\n",
                encoding="utf-8"
            )

            os.chmod(temporary, 0o600)
            os.replace(temporary, target)
            PY

            chmod 600 .env

            # 임시 파일 삭제
            rm -f .env.deploy

            # Docker Compose 설정 검증
            if ! docker compose config -q; then
              echo "Docker Compose 설정 검증 실패"

              if [ "$HAD_ENV" -eq 1 ]; then
                cp .env.backup .env
                chmod 600 .env
              else
                rm -f .env
              fi

              exit 1
            fi

            # 최신 이미지 다운로드
            docker compose pull prodflow-app

            # 새로운 .env를 적용해 컨테이너 재생성
            docker compose up -d \
              --no-deps \
              --force-recreate \
              prodflow-app

            # Nginx가 내려가 있으면 실행
            docker compose up -d --no-deps nginx

            # 배포 결과 확인
            docker compose ps

      # 9. GitHub Actions 임시 파일 삭제
      - name: 임시 환경변수 파일 정리
        if: always()
        run: |
          rm -f .env.deploy
