name: Deploy PRODFLOW

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prodflow-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 시스템 프롬프트 배치
        env:
          PRODFLOW_SYSTEM_PROMPT: ${{ secrets.PRODFLOW_SYSTEM_PROMPT }}
        run: |
          if [ -z "$PRODFLOW_SYSTEM_PROMPT" ]; then 
            echo "PRODFLOW_SYSTEM_PROMPT 시크릿이 없습니다." 
            exit 1 
          fi 
          
          mkdir -p src/main/resources/prompts 
          printf '%s' "$PRODFLOW_SYSTEM_PROMPT" \ 
            > src/main/resources/prompts/prodflow-system.txt

      - name: Docker Hub Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            minkyolim/prodflow:latest
            minkyolim/prodflow:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            cd /home/ec2-user/prodflow

            docker compose config -q
            docker compose pull prodflow-app
            docker compose up -d --no-deps --force-recreate prodflow-app

            docker compose ps
